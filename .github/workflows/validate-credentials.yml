name: Validate store credentials

# Read-only: checks the AMO and Chrome Web Store secrets/variables without uploading anything.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-credentials.yml
      - scripts/check-store-credentials.mjs
      - scripts/chrome-web-store.mjs
      - scripts/amo-version.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/check-store-credentials.mjs
      - name: Look up this version on AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          version=$(node -p "require('./package.json').version")
          channel=$(node scripts/amo-version.mjs "$version")
          echo "::notice::AMO version $version: ${channel:-not on AMO}"
