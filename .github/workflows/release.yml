name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  ZIP_PREFIX: acdl-debugger-${{ github.ref_name }}
  AMO_SLUG: acdl-debugger

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check tag matches package.json and manifest.json
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package extension
        run: |
          for target in chrome firefox safari; do
            (cd "dist/$target" && zip -r -X "../../$ZIP_PREFIX-$target.zip" . -x '*.map')
          done

      - name: Write release notes
        env:
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --invert-grep --grep='^chore: release v' --format='- %s' "${previous:+$previous..}$GITHUB_REF_NAME"
            if [ -n "$previous" ]; then
              echo
              echo "**Full diff:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
            echo
            echo "## Install"
            echo
            if [ -n "$CWS_EXTENSION_ID" ]; then
              echo "- **Chrome:** install from the [Chrome Web Store](https://chromewebstore.google.com/detail/$CWS_EXTENSION_ID); this version reaches it after Google's review. To load it unpacked instead, download \`$ZIP_PREFIX-chrome.zip\` and unzip it. Open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked**, and select the unzipped folder."
            else
            echo "- **Chrome:** download \`$ZIP_PREFIX-chrome.zip\` and unzip it. Open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked**, and select the unzipped folder."
            fi
            echo "- **Firefox:** install from [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/$AMO_SLUG/) (Firefox 142+); this version appears there after Mozilla's review. \`$ZIP_PREFIX-firefox.zip\` is the unsigned build, which loads only as a temporary add-on from \`about:debugging#/runtime/this-firefox\`."
            echo "- **Safari:** \`$ZIP_PREFIX-safari.zip\` is the web-extension folder for Xcode. Unzip it on a Mac and run \`xcrun safari-web-extension-converter\` on it (see the README)."
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP_PREFIX"-*.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag

  chrome-web-store:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Submit to the Chrome Web Store
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern "$ZIP_PREFIX-chrome.zip"
          node scripts/chrome-web-store.mjs "$ZIP_PREFIX-chrome.zip"

  firefox-sign:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Submit Firefox add-on to AMO (listed)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET secrets are not set; skipping AMO submission."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          existing=$(node scripts/amo-version.mjs "$version")
          if [ -n "$existing" ]; then
            echo "::warning::AMO already has version $version ($existing channel); skipping submission. Bump the version to publish a new one."
            exit 0
          fi
          gh release download "$GITHUB_REF_NAME" --pattern "$ZIP_PREFIX-firefox.zip"
          unzip -q "$ZIP_PREFIX-firefox.zip" -d firefox-build
          git archive --format=zip -o source.zip HEAD
          npx --yes web-ext@10.7.0 sign --channel=listed \
            --source-dir firefox-build \
            --upload-source-code source.zip \
            --approval-timeout 0
          echo "::notice::Submitted $version to AMO (listed); it goes live after Mozilla's review."
